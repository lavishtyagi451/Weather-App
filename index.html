
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-container">
    
    <div class="search">
   
       <input type="text" id="cityInput" placeholder="Enter city name...">
       <button id="myButton"><img src= "images\searchpng"></button>


    </div>

    <div class="weather-info">

        <img class="weatherIcon" src="images\clear.png" alt="Weather Icon">

        <div class="search-output">
          <h1 class="temperature">33°C</h1>
          <h2 class="cityName" >Banglore</h2>
        </div>
    <div class="details">
        <div class="col-1 ">
            <img class = "humidityIcon" src="images/humidity.png" alt="Humidity Icon"  >
            <div>
             <p class="humidity">60% </p>
             <p class = "humidity-text">Humidity</p>
             </div>

        
         </div>  

        <div class="col-2">
            <img class = "windIcon" src="images/wind.png" alt="Wind Icon" >
                
            <div>  
                <p class="wind-speed">10 km/h</p>
                <p class="wind-text">Wind Speed</p>
            </div>
        </div>   
             

        
        
    </div>
    

</div>




    
</body>

   
    







</html>
